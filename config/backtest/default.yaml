# Paired experiment on the daily-loss rule (01 §8.16): layer A, 2015 to the latest data day.
#
# Both arms replay the same daily bars (intraday paths synthesized, official settlement prices) with the same
# dual moving-average strategy per account, through the production EngineCore and settle_day; only the rules differ:
#   no_rules     no rule at all
#   block_open   the production daily-loss rule: warn -2%, restrict -2.5% (order size x0.5, no adding to losers),
#                circuit break -3% (opens rejected, latched), derisk -5% (plan only)
# The strategy evaluates its moving averages at every market state (today's price as today's close), so a flip can
# happen on a bad day; after the breaker latches, the flip's opening leg is rejected. The difference between the arms
# on those days is the rule's effect (10 文档).
# Run: futrisk backtest run default [--set start=20210101] [--set rules.threshold=0.02] [--out DIR]
name: default
description: >-
  日亏熔断规则的配对实验（A 层日线 2015 年至今、合成日内路径、官方结算价）：同样的双均线策略，
  不启用规则（no_rules）与启用生产的日亏规则（block_open）逐日对比。
kind: arms
layer: A
start: "20150105"
end: null
products: [rb, hc, cu, au, i, j, m, IF, IC, T]
# products default to each account's products in accounts.yaml
accounts:
  ACC1: {strategy: dual_ma}
  ACC2: {strategy: dual_ma}
  ACC3: {strategy: dual_ma}
  ACC4: {strategy: dual_ma}
  ACC5: {strategy: dual_ma}
arms:
  - {name: no_rules, tier: none}
  - {name: block_open, tier: block_open}
rules:
  threshold: 0.03
path:
  rule: open_near_extreme
warmup_days: 40
seed: 20260928
workers: auto
