# Stress windows (plan §7.1): each window is a separate run of every arm with 80 trading days of
# indicator warm-up before it (no trading during the warm-up); capital restarts at the window start.
# Each window replays K = ensemble.paths realizations of the calibrated intraday path model (medians and
# 5-95 % path ranges in the report; the intraday charts show path 0). ACC3B = ACC3 without its ladder (control).
# The 2022-03 nickel squeeze is skipped: ni is not a futrisk product (products.yaml) and was not fetched.
# Run: futrisk backtest run stress
name: stress
description: >-
  压力窗口：2015-07 股灾、2016-11-14 黑色暴跌、2020-02-03 节后跌停、2021-05 铁矿石、2021-10 焦炭、2024-10-08 股指涨停开盘、
  黄金大跌日；每个窗口单独回测所有方案（窗口前 80 个交易日只用于指标预热）。
kind: stress
layer: A
products: [rb, hc, cu, au, i, j, m, IF, IH, IC, IM, T]
accounts:
  ACC1: {strategy: channel_breakout}
  ACC2: {strategy: multi_trend}
  ACC3: {strategy: counter_trend_add}
  ACC4: {strategy: index_directional}
  ACC5: {strategy: rb_calendar_spread}
  ACC3B: {strategy: counter_trend_add, params: {max_adds: 0}, capital: 10000000, role: control, title: ACC3 无加仓对照}
arms:
  - {name: no_rules, tier: none}
  - {name: alert_only, tier: alert_only}
  - {name: block_open, tier: block_open}
  - {name: halt_only, tier: halt_only}
  - {name: halve, tier: halve}
  - {name: flatten, tier: flatten}
rules:
  threshold: 0.03
ensemble:
  paths: 20
stress:
  warmup_days: 80
  windows:
    - id: 2015_07_index_crash
      title: 2015-07 股灾
      start: "20150615"
      end: "20150731"
      focus_day: "20150708"
      products: [IF, IH, IC]
      note: IF/IH/IC 在 07-08 跌停、07-09 涨停；股指当时的交易时段是 09:15-15:15（回测用今天的时段模板）。
    - id: 2016_11_black
      title: 2016-11-14 黑色暴跌
      start: "20161101"
      end: "20161130"
      focus_day: "20161114"
      products: [rb, hc, i, j]
      note: rb1701 结算价对结算价只跌 0.07%，但盘中低点 -4.80%（夜盘高开 +3.42%）；11-15 rb/hc 跌停 -6.02%。
    - id: 2020_02_holiday
      title: 2020-02-03 节后跌停
      start: "20200115"
      end: "20200228"
      focus_day: "20200203"
      note: 春节后首日 11 个品种大跌：rb -8.02%、IF -10% 开盘即封板，封板方向无法成交。
    - id: 2021_05_iron_ore
      title: 2021-05 铁矿石
      start: "20210501"
      end: "20210531"
      focus_day: "20210513"
      products: [i]
      note: 铁矿石先涨约 10% 再跌约 7.5%。
    - id: 2021_10_coke
      title: 2021-10 焦炭连跌后反弹
      start: "20211008"
      end: "20211130"
      focus_day: "20211021"
      products: [j]
      note: 焦炭先涨 9%，放宽涨跌停后跌 12%，随后反弹。
    - id: 2024_10_if_limit_up
      title: 2024-10-08 股指涨停开盘
      start: "20240920"
      end: "20241031"
      focus_day: "20241008"
      products: [IF, IH, IC, IM]
      note: IF2412 以 +10% 涨停开盘、收 +3.13%：空头在开盘状态无法平仓。
    - id: gold_drops
      title: 黄金大跌日
      auto: largest_drops
      auto_product: au
      top_n: 3
      pad_days: 5
      note: au 同合约结算价跌幅最大的 3 个交易日（前后各 5 个交易日）。
  skipped:
    - {id: 2022_03_nickel, reason: 沪镍（ni）不在 products.yaml 的品种列表中，没有抓取数据}
seed: 20260928
workers: auto
