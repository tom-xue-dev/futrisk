# Layer C: recorded Sina ticks (<home>/ticks/raw/<td>/sina/part-*.parquet, written by `futrisk data record`;
# the real recording runs 2026-09-28..09-30). Only LIVE rows are replayed, in exchange-time order; the day
# settles on prices computed from the replayed tape with the 01 §8.15 rules (SHFE/DCE full-day VWAP, CFFEX
# last hour, exchange rounding). Strategy indicators are warmed up on the layer A daily history.
# Run: futrisk backtest run ticks [--set data.ticks_home=D:/somewhere] [--set 'data.tick_days=["20260929"]']
name: ticks
description: >-
  C 层：回放自录的新浪 tick（仅 LIVE 行），结算价按 01 §8.15 从回放数据计算；no_rules 对比 block_open。
kind: arms
layer: C
data:
  ticks_home: null      # default: the futrisk home (<repo>/var in development)
  tick_days: []         # default: every recorded trading day
products: [rb, hc, i, j, m, IF, IH, IC, IM, T, cu, au]
accounts:
  ACC1: {strategy: channel_breakout}
  ACC2: {strategy: multi_trend}
  ACC3: {strategy: counter_trend_add}
  ACC4: {strategy: index_directional}
arms:
  - {name: no_rules, tier: none}
  - {name: alert_only, tier: alert_only}
  - {name: block_open, tier: block_open}
rules:
  threshold: 0.03
warmup_days: 60
analysis:
  hit_rate: false
  bounding: true
seed: 20260928
workers: auto
