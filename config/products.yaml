# Exchange rules, products, contracts and session templates (01 §8.9, §8.15).
# Values are examples verified against exchange data around 2026-09-24;
# production must take them from the latest exchange notices.

session_templates:
  night_2100_2300: [["20:55", "21:00", "auction"], ["21:00", "23:00", "continuous"]]
  night_2100_0100: [["20:55", "21:00", "auction"], ["21:00", "01:00", "continuous"]]
  night_2100_0230: [["20:55", "21:00", "auction"], ["21:00", "02:30", "continuous"]]
  day_commodity:
    - ["08:55", "09:00", "auction_no_night"]
    - ["09:00", "10:15", "continuous"]
    - ["10:30", "11:30", "continuous"]
    - ["13:30", "15:00", "continuous"]
  day_index:
    - ["09:25", "09:30", "auction"]
    - ["09:30", "11:30", "continuous"]
    - ["13:00", "15:00", "continuous"]
  day_treasury:
    - ["09:25", "09:30", "auction"]
    - ["09:30", "11:30", "continuous"]
    - ["13:00", "15:15", "continuous"]

exchanges:
  SHFE:
    explicit_close_today: true
    close_style: FIFO
    close_today_fee_rule: LOT_MATCH
    settle_rounding: FLOOR_TICK
    settle_fallback: [MEDIAN, LIMIT, PRE_SETTLE]
    big_side: SAME_PRODUCT
    big_side_exit: LAST_TRADE_DAY_MINUS_5
    cancel_limit: 500
    large_cancel: {count: 50, min_qty: 300}
    self_trade_limit: 5
  DCE:
    explicit_close_today: false
    close_style: FIFO
    close_today_fee_rule: INTRADAY_BOTH_LEGS
    settle_rounding: ROUND_TICK
    settle_fallback: [MEDIAN, LIMIT, PRE_SETTLE]
    big_side: NONE
    cancel_limit: 500
    large_cancel: {count: 50, min_qty: 800}
    self_trade_limit: 5
  CFFEX:
    explicit_close_today: false
    close_style: TODAY_FIRST          # 先平当日新开仓：lot consumption agrees with the close-today fee rule
    close_today_fee_rule: SAME_DAY_OPENS_FIRST
    settle_rounding: ROUND_TICK
    settle_fallback: [HOURLY, FULLDAY, BENCHMARK, PRE_SETTLE]
    big_side: GROUPS
    big_side_exit: PHYSICAL_DELIVERY_MONTH_MINUS_1
    cancel_limit: 400
    large_cancel: {count: 100, min_qty: 16}
    self_trade_limit: 5

