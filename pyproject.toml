[project]
name = "futrisk"
version = "0.1.0"
description = "Multi-product futures risk control and clearing system (SHFE / DCE / CFFEX)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyzmq (>=27.1,<28.0)",
    "msgspec (>=0.19,<0.20)",
    "pydantic (>=2.9,<3.0)",
    "pydantic-settings (>=2.5,<3.0)",
    "pyyaml (>=6.0,<7.0)",
    "typer (>=0.12,<1.0)",
    "rich (>=13.7,<15.0)",
    "loguru (>=0.7.2,<0.8.0)",
    "fastapi (>=0.115,<1.0)",
    "uvicorn[standard] (>=0.30,<1.0)",
    "websockets (>=13.0,<16.0)",
    "httpx (>=0.27,<1.0)",
    "sqlalchemy (>=2.0.30,<3.0)",
    "pyarrow (>=17.0,<22.0)",
    "pandas (>=2.2,<3.0)",
    "numpy (>=2.0,<3.0)",
    "jinja2 (>=3.1,<4.0)",
    "matplotlib (>=3.9,<4.0)",
    "tzdata (>=2024.1)",
    "psutil (>=6.0,<8.0)",
]

[project.scripts]
futrisk = "futrisk.main:main"

[tool.poetry]
packages = [{ include = "futrisk", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
pytest-asyncio = ">=0.24,<2.0"
pytest-cov = ">=5.0,<7.0"
pytest-timeout = ">=2.3,<3.0"
hypothesis = ">=6.100,<7.0"
ruff = ">=0.6,<1.0"
mypy = ">=1.11,<2.0"
types-pyyaml = ">=6.0"
pyinstaller = "^6.22.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = [
    "slow: long-running tests (multi-process, network loopback)",
    "e2e: multi-process end-to-end tests",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "TID"]
ignore = ["E501", "B008", "UP046", "UP047", "SIM108"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.time".msg = "core must not read the system clock; inject a Clock"
"datetime.datetime.now".msg = "core must not read the system clock; inject a Clock"
"datetime.datetime.utcnow".msg = "core must not read the system clock; inject a Clock"
"datetime.date.today".msg = "core must not read the system clock; inject a Clock"
"time.time_ns".msg = "core must not read the system clock; inject a Clock"
"time.monotonic".msg = "core must not read the system clock; inject a Clock"
"time.monotonic_ns".msg = "core must not read the system clock; inject a Clock"
"time.perf_counter".msg = "core must not read the system clock; inject a Clock"
"time.perf_counter_ns".msg = "core must not read the system clock; inject a Clock"
"random.random".msg = "core must be deterministic; inject a seeded random.Random"
"random.randint".msg = "core must be deterministic; inject a seeded random.Random"
"random.choice".msg = "core must be deterministic; inject a seeded random.Random"
"random.uniform".msg = "core must be deterministic; inject a seeded random.Random"
"random.gauss".msg = "core must be deterministic; inject a seeded random.Random"
"random.shuffle".msg = "core must be deterministic; inject a seeded random.Random"
"uuid.uuid4".msg = "core must be deterministic; inject an IdGen"
"uuid.uuid1".msg = "core must be deterministic; inject an IdGen"

[tool.ruff.lint.per-file-ignores]
"src/futrisk/common/*" = ["TID251"]
"src/futrisk/services/*" = ["TID251"]
"src/futrisk/sim/*" = ["TID251"]
"src/futrisk/bus/*" = ["TID251"]
"src/futrisk/main.py" = ["TID251"]
"src/futrisk/cli/*" = ["TID251"]
"scripts/*" = ["TID251"]
"tests/*" = ["TID251"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["futrisk.core.*", "futrisk.messages.*", "futrisk.bus.*"]
strict = true
